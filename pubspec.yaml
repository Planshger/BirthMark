name: birthmark
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  provider: ^6.1.5+1

  # Dependency Injection
  get_it: ^8.2.0
  injectable: ^2.5.2

  # Data & Storage
  hive_ce: ^2.15.0
  hive_ce_flutter: ^2.3.2
  postgres: ^3.5.9
  shared_preferences: ^2.5.4

  # UI
  cupertino_icons: ^1.0.8
  glass_kit: ^4.0.2
  flutter_slidable: ^4.0.3

  # Utils
  uuid: ^4.5.2
  flutter_dotenv: ^6.0.0
  json_annotation: ^4.8.0
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.9.0
  hive_ce_generator: ^1.10.0
  injectable_generator: ^2.9.0

  # Linting & Analysis
  flutter_lints: ^5.0.0
  analyzer: ^8.4.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/data/onboarding_data.json

